<!DOCTYPE html>
<html>

<head>

<title>EdgeVision Guard - Analytics</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>

<header>
    <h1>EdgeVision Guard</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="analytics.html" class="active">Analytics</a>
    </nav>
</header>

<main>
    <h2>Analytics</h2>
    
    <div class="analytics-container">
        <div class="stat-card">
            <h3>Total Events</h3>
            <p id="total-events">-</p>
        </div>
        
        <div class="stat-card">
            <h3>Cameras Active</h3>
            <p id="cameras-active">-</p>
        </div>
        
        <div class="stat-card">
            <h3>Detection Types</h3>
            <p id="detection-types">-</p>
        </div>
    
    <div class="chart-container">
        <h3>Event Distribution</h3>
        <p style="color:#888;">Analytics charts will be displayed here</p>
    </div>
</main>

<footer>
<p>&copy; 2026 EdgeVision Guard - Security Monitoring System</p>
</footer>

<script src="script.js"></script>

<script>
    // Analytics functionality
    async function loadAnalytics() {
        const totalEl = document.getElementById('total-events');
        const camerasEl = document.getElementById('cameras-active');
        const typesEl = document.getElementById('detection-types');
        
        try {
            const response = await fetch("http://localhost:8000/api/events", {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();
            
            // Calculate statistics
            const totalEvents = data.length;
            
            // Get unique cameras
            const cameras = [...new Set(data.map(e => e.camera_id))];
            
            // Get unique event types
            const types = [...new Set(data.map(e => e.type))];
            
            totalEl.textContent = totalEvents;
            camerasEl.textContent = cameras.length;
            typesEl.textContent = types.length;
            
        } catch (error) {
            console.error('Error loading analytics:', error);
            totalEl.textContent = '-';
            camerasEl.textContent = '-';
            typesEl.textContent = '-';
        }
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', () => {
        loadTheme();
        loadAnalytics();
    });
</script>

</body>

</html>
